name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Check release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Verify tag matches package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --with packaging python -c '
          import os, tomllib
          from packaging.version import Version
          with open("Cargo.toml", "rb") as stream:
              version = Version(tomllib.load(stream)["package"]["version"])
          tag = os.environ["RELEASE_TAG"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"Release tag {tag!r} must be {expected!r}")
          '

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/solidfunc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Publish using PyPI trusted publishing
        run: uv publish --trusted-publishing always dist/*
