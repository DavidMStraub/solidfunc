[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "solidfunc"
dynamic = ["version"]
description = "An experimental functional Python API for SolidCore."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "David Straub" }]
keywords = ["cad", "geometry", "solidcore", "functional"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/DavidMStraub/solidfunc"
Issues = "https://github.com/DavidMStraub/solidfunc/issues"

[dependency-groups]
dev = [
    "maturin>=1.16,<2",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]

[tool.maturin]
python-source = "python"
module-name = "solidfunc._core"
bindings = "pyo3"
include = [
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "examples/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "rust-toolchain.toml" },
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/solidfunc", "examples"]

[[tool.mypy.overrides]]
module = ["cadquery", "ocp_vscode"]
ignore_missing_imports = true
follow_imports = "skip"
