[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "solidfunc"
dynamic = ["version"]
description = "Typed, functional Python CAD on SolidCore, a Rust B-rep kernel: an experiment in kernel dependence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "David M. Straub" }]
keywords = [
    "cad",
    "cad-as-code",
    "code-cad",
    "parametric",
    "brep",
    "step",
    "geometry",
    "solidcore",
    "functional",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/DavidMStraub/solidfunc"
Documentation = "https://github.com/DavidMStraub/solidfunc/blob/main/API.md"
Changelog = "https://github.com/DavidMStraub/solidfunc/releases"
Issues = "https://github.com/DavidMStraub/solidfunc/issues"
"CAD as Code book" = "https://github.com/DavidMStraub/cad-as-code-book"

[dependency-groups]
dev = [
    "maturin>=1.16,<2",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]

[tool.maturin]
python-source = "python"
module-name = "solidfunc._core"
bindings = "pyo3"
include = [
    { path = ".cargo/config.toml", format = "sdist" },
    { path = "Cargo.lock", format = "sdist" },
    { path = "examples/**", format = "sdist" },
    { path = "tests/**", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "rust-toolchain.toml" },
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["python/solidfunc", "examples"]

[[tool.mypy.overrides]]
module = ["cadquery", "ocp_vscode"]
ignore_missing_imports = true
follow_imports = "skip"
