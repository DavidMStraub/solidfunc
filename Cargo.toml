[package]
name = "solidfunc"
version = "0.1.0-alpha.5"
edition = "2021"
rust-version = "1.96"
description = "Typed, functional Python CAD on SolidCore, a Rust B-rep kernel: an experiment in kernel dependence."
license = "MIT"
repository = "https://github.com/DavidMStraub/solidfunc"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "d48d68e4ca37d259a5d6d150f95a53d6df56f4c7" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = 0
strip = "debuginfo"
